  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --primary: #1F4E79;

    --accent: #E74C3C;
    --green: #27AE60;
    --orange: #F39C12;
    --blue: #3498DB;
    --purple: #9B59B6;
    --bg: #F0F2F5;
    --card: #FFFFFF;
    --text: #2C3E50;
    --text-light: #7F8C8D;
    --border: #E0E0E0;
    --shadow: 0 2px 12px rgba(0,0,0,0.08);
    --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }
  .header {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
    color: #fff;
    padding: 24px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 4px 20px rgba(31,78,121,0.3);
  }
  .header h1 { font-size: 24px; font-weight: 700; letter-spacing: 1px; }
  .header .source { font-size: 13px; opacity: 0.85; background: rgba(255,255,255,0.15); padding: 6px 16px; border-radius: 20px; }
  .kpi-section { padding: 24px 40px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px; }
  .kpi-card {
    background: var(--card); border-radius: 16px; padding: 24px; box-shadow: var(--shadow);
    text-align: center; transition: transform 0.3s, box-shadow 0.3s; position: relative; overflow: hidden;
  }
  .kpi-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
  .kpi-card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px; }
  .kpi-card.total::before { background: var(--primary); }
  .kpi-card.unfixed::before { background: var(--accent); }
  .kpi-card.verified::before { background: var(--orange); }
  .kpi-card.close-rate::before { background: var(--green); }
  .kpi-card.fix-rate::before { background: var(--blue); }
  .kpi-label { font-size: 13px; color: var(--text-light); margin-bottom: 8px; font-weight: 500; }
  .kpi-value { font-size: 40px; font-weight: 800; line-height: 1.1; }
  .kpi-card.total .kpi-value { color: var(--primary); }
  .kpi-card.unfixed .kpi-value { color: var(--accent); }
  .kpi-card.verified .kpi-value { color: var(--orange); }
  .kpi-card.close-rate .kpi-value { color: var(--green); }
  .kpi-card.fix-rate .kpi-value { color: var(--blue); }
  .kpi-unit { font-size: 18px; font-weight: 500; }
  .kpi-desc { font-size: 12px; color: var(--text-light); margin-top: 4px; }
  .main-content { padding: 0 40px 40px; display: grid; grid-template-columns: 1fr 1.4fr; gap: 24px; }
  .section-card { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
  .section-header { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .section-title { font-size: 16px; font-weight: 700; color: var(--primary); }
  .chart-container { padding: 24px; height: 420px; position: relative; }
  .issue-section { display: flex; flex-direction: column; }
  .group-selector { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 16px; background: #FAFBFC; }
  .group-selector label { font-size: 14px; font-weight: 600; color: var(--primary); white-space: nowrap; }
  .group-selector select {
    flex: 1; padding: 10px 16px; border: 2px solid var(--border); border-radius: 10px;
    font-size: 14px; color: var(--text); background: #fff; cursor: pointer; outline: none;
    transition: border-color 0.3s; font-family: inherit;
  }
  .group-selector select:focus { border-color: var(--primary-light); }
  .group-stats-bar { padding: 12px 24px; display: flex; gap: 20px; background: linear-gradient(to right, #F8F9FA, #fff); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .group-stat { display: flex; align-items: center; gap: 6px; font-size: 13px; }
  .group-stat .dot { width: 10px; height: 10px; border-radius: 50%; }
  .group-stat .num { font-weight: 700; font-size: 15px; }
  .issue-list { flex: 1; overflow-y: auto; max-height: 380px; }
  .issue-list::-webkit-scrollbar { width: 6px; }
  .issue-list::-webkit-scrollbar-track { background: #f1f1f1; }
  .issue-list::-webkit-scrollbar-thumb { background: #bbb; border-radius: 3px; }
  .issue-item { padding: 14px 24px; border-bottom: 1px solid #F0F0F0; transition: background 0.2s; display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; }
  .issue-item:hover { background: #F8FBFF; }
  .issue-item:last-child { border-bottom: none; }
  .severity-badge { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 8px; font-size: 11px; font-weight: 800; color: #fff; flex-shrink: 0; }
  .severity-A { background: #E74C3C; }
  .severity-B { background: #E67E22; }
  .severity-C { background: #3498DB; }
  .severity-D { background: #95A5A6; }
  .issue-content { min-width: 0; }
  .issue-id { font-size: 12px; color: var(--text-light); font-family: Consolas, Monaco, monospace; }
  .issue-title { font-size: 14px; font-weight: 500; color: var(--text); margin: 2px 0; line-height: 1.4; word-break: break-all; }
  .issue-meta { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 4px; }
  .issue-tag { font-size: 11px; padding: 2px 8px; border-radius: 4px; background: #F0F2F5; color: var(--text-light); }
  .status-tag { font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 600; }
  .status-已分配 { background: #FFF3CD; color: #856404; }
  .status-修复中 { background: #CCE5FF; color: #004085; }
  .status-已修复待验证 { background: #D4EDDA; color: #155724; }
  .status-已关闭 { background: #E2E3E5; color: #383D41; }
  .status-评审关闭 { background: #E2E3E5; color: #383D41; }
  .status-测试审核不通过关闭 { background: #F8D7DA; color: #721C24; }
  .status-已拒绝 { background: #F5C6CB; color: #721C24; }
  .status-测试审核 { background: #B8DAFF; color: #004085; }
  .status-默认 { background: #E2E3E5; color: #383D41; }
  .no-data { text-align: center; padding: 60px 20px; color: var(--text-light); font-size: 14px; }
  .no-data .icon { font-size: 48px; margin-bottom: 12px; opacity: 0.4; }
  .group-color-dot { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: middle; }
  .rate-ring { display: flex; align-items: center; justify-content: center; gap: 8px; }
  .ring-svg { width: 44px; height: 44px; }
  .ring-bg { fill: none; stroke: #E8E8E8; stroke-width: 4; }
  .ring-fill { fill: none; stroke-width: 4; stroke-linecap: round; transition: stroke-dashoffset 1s ease; }
  .ring-fill.green { stroke: var(--green); }
  .ring-fill.blue { stroke: var(--blue); }
  .ring-text { font-size: 11px; fill: var(--text); font-weight: 700; }
</style>
</head>

<div class="header">
  <h1>UN10 系列缺陷看板</h1>
  <span class="source" id="source"></span>
</div>

<!-- KPI Cards -->
<div class="kpi-section" id="kpi-section"></div>

<!-- Main Content -->
<div class="main-content">
  <!-- Left: Chart -->
  <div class="section-card">
    <div class="section-header">

    <div class="section-header">
      <span class="section-title">各组问题明细</span>
    </div>
    <div class="group-selector">
      <label>选择组别：</label>
      <select id="groupSelect"></select>
    </div>
    <div class="group-stats-bar" id="groupStatsBar"></div>
    <div class="issue-list" id="issueList"></div>
  </div>
</div>

<!-- Burndown Chart -->
<div class="section-card" style="margin:0 40px 24px;">
  <div class="section-header">
    <span class="section-title">&#128200; 未修复缺陷燃尽图（最近5个工作日）</span>
    <span style="font-size:13px;color:#7F8C8D;">点击图例可切换组别显示</span>
  </div>
  <div class="chart-container" style="height:420px;padding:24px;">
    <canvas id="burndownChart"></canvas>
  </div>
</div>

<!-- Rate Trend Chart -->
<div class="section-card" style="margin:0 40px 24px;">
  <div class="section-header">
    <span class="section-title">&#128201; 关闭率 &amp; 修复率趋势（最近5个工作日）</span>
  </div>
  <div class="chart-container" style="height:320px;padding:24px;">
    <canvas id="rateTrendChart"></canvas>
  </div>
</div>

<!-- Verified Issues List -->
<div class="section-card" style="margin:0 40px 40px;">
  <div class="section-header">
    <span class="section-title">&#9989; 已修复待验证问题列表</span>
    <span style="font-size:13px;color:#7F8C8D;" id="verifiedCount"></span>
  </div>
  <div class="group-selector">
    <label>选择组别：</label>
    <select id="verifiedGroupSelect"></select>
  </div>
  <div class="group-stats-bar" id="verifiedStatsBar"></div>
  <div class="issue-list" id="verifiedIssueList" style="max-height:500px;"></div>
</div>

<!-- Severe Issues List -->
<div class="section-card" style="margin:0 40px 40px;">
  <div class="section-header">
    <span class="section-title">&#9888; 严重问题列表（A 级 &amp; B 级）</span>
    <span style="font-size:13px;color:#7F8C8D;" id="severeCount"></span>
  </div>
  <div class="group-stats-bar" id="severeStatsBar" style="gap:30px;">
    <div class="group-stat"><div class="dot" style="background:#E74C3C;"></div> A 级致命 <span class="num" id="severeA" style="color:#E74C3C;">0</span></div>
    <div class="group-stat"><div class="dot" style="background:#E67E22;"></div> B 级严重 <span class="num" id="severeB" style="color:#E67E22;">0</span></div>
    <div class="group-stat"><div class="dot" style="background:#CCE5FF;"></div> 未修复 <span class="num" id="severeUnfixed">0</span></div>
    <div class="group-stat"><div class="dot" style="background:#D4EDDA;"></div> 已修复待验证 <span class="num" id="severeVerified">0</span></div>
  </div>
  <div class="group-selector">
    <label>筛选状态：</label>
    <select id="severeStatusSelect">
      <option value="__all__">全部</option>
      <option value="unfixed">未修复</option>
      <option value="verified">已修复待验证</option>
    </select>
  </div>
  <div class="issue-list" id="severeIssueList" style="max-height:600px;"></div>
</div>

  const section = document.getElementById('kpi-section');

  section.innerHTML = cards.map(c => {
    let ringHtml = '';
    if (c.isRate) {
      const r = 18, circ = 2 * Math.PI * r;

      ringHtml = `
        <div class="rate-ring" style="margin-top:8px;justify-content:center;">

            <circle class="ring-bg" cx="22" cy="22" r="${r}"/>

              transform="rotate(-90 22 22)"/>
            <text class="ring-text" x="22" y="26" text-anchor="middle">${c.value}</text>
          </svg>
        </div>`;
      return `
        <div class="kpi-card ${c.cls}">
          <div class="kpi-label">${c.label}</div>
          <div class="kpi-value">${c.value}<span class="kpi-unit">${c.unit}</span></div>
          ${ringHtml}
          <div class="kpi-desc">${c.desc}</div>
        </div>`;
    }
    return `
      <div class="kpi-card ${c.cls}">
        <div class="kpi-label">${c.label}</div>
        <div class="kpi-value">${c.value}<span class="kpi-unit">${c.unit}</span></div>
        <div class="kpi-desc">${c.desc}</div>

  }).join('');
}

// Group selector & issue list
function initIssueList() {
  const select = document.getElementById('groupSelect');
  const groups = DATA.groups;

  let optionsHtml = '<option value="__all__">\u5168\u90e8\u7ec4\u522b</option>';
  groups.forEach(g => {
    optionsHtml += '<option value="' + g.name + '">' + g.name + ' (' + g.total + ')</option>';
  });
  select.innerHTML = optionsHtml;

  select.addEventListener('change', function() {
    renderIssueList(select.value);
    renderGroupStats(select.value);
  });

  renderIssueList('__all__');
  renderGroupStats('__all__');
}

function renderGroupStats(selected) {
  const bar = document.getElementById('groupStatsBar');
  let total = 0, unfixed = 0, verified = 0, closed = 0;

  if (selected === '__all__') {
    const kpi = DATA.kpi;
    total = kpi.total;
    unfixed = kpi.unfixed;
    verified = kpi.verified;
    closed = kpi.closed;
  } else {
    const g = DATA.groups.find(function(g) { return g.name === selected; });
    if (g) {
      total = g.total;
      unfixed = g.unfixed;
      verified = g.verified;
      closed = g.closed;
    }
  }

  bar.innerHTML =
    '<div class="group-stat"><div class="dot" style="background:#2E75B6;"></div> \u603b\u6570 <span class="num">' + total + '</span></div>' +
    '<div class="group-stat"><div class="dot" style="background:#E74C3C;"></div> \u672a\u4fee\u590d <span class="num">' + unfixed + '</span></div>' +
    '<div class="group-stat"><div class="dot" style="background:#27AE60;"></div> \u5df2\u4fee\u590d\u5f85\u9a8c\u8bc1 <span class="num">' + verified + '</span></div>' +
    '<div class="group-stat"><div class="dot" style="background:#95A5A6;"></div> \u5df2\u5173\u95ed <span class="num">' + closed + '</span></div>' +
    '<div class="group-stat">\u5173\u95ed\u7387 <span class="num" style="color:#27AE60;">' + (total > 0 ? Math.round(closed / total * 100 * 10) / 10 : 0) + '%</span></div>' +
    '<div class="group-stat">\u4fee\u590d\u7387 <span class="num" style="color:#3498DB;">' + (total > 0 ? Math.round((closed + verified) / total * 100 * 10) / 10 : 0) + '%</span></div>';
}

function getSeverityClass(severity) {
  if (severity.includes('A')) return 'severity-A';
  if (severity.includes('B')) return 'severity-B';
  if (severity.includes('C')) return 'severity-C';
  if (severity.includes('D')) return 'severity-D';
  return 'severity-C';
}

function getStatusClass(status) {
  return 'status-' + status || 'status-\u9ed8\u8ba4';
}

function renderIssueList(selected) {
  const list = document.getElementById('issueList');

  let issues = [];
  if (selected === '__all__') {
    for (const gname of Object.keys(DATA.group_issues)) {
      const groupIssues = DATA.group_issues[gname];
      groupIssues.forEach(function(issue) {
        issues.push(Object.assign({}, issue, { group: gname }));
      });
    }
    const sevOrder = { 'A\uff1a\u81f4\u547d': 0, 'A': 0, 'B\uff1a\u4e25\u91cd': 1, 'B': 1, 'C\uff1a\u4e00\u822c': 2, 'C': 2, 'D\uff1a\u4f18\u5316\u5efa\u8bae': 3, 'D': 3 };
    issues.sort(function(a, b) {
      const sa = sevOrder[a.severity] != null ? sevOrder[a.severity] : 9;
      const sb = sevOrder[b.severity] != null ? sevOrder[b.severity] : 9;
      if (sa !== sb) return sa - sb;
      return a.group.localeCompare(b.group);
    });
  } else {
    const groupIssues = DATA.group_issues[selected] || [];
    issues = groupIssues.map(function(issue) { return Object.assign({}, issue, { group: selected }); });
  }

  if (issues.length === 0) {
    list.innerHTML = '<div class="no-data"><div class="icon">&#128203;</div>\u6682\u65e0\u7f3a\u9677\u6570\u636e</div>';
    return;
  }

  list.innerHTML = issues.map(function(issue) {
    const sevClass = getSeverityClass(issue.severity);
    const sevLabel = issue.severity.replace(/[\uff1a:]/g, '').charAt(0);
    const statusClass = getStatusClass(issue.status);
    const groupColor = GROUP_COLORS[issue.group] || '#E0E0E0';

    return '<div class="issue-item">' +
      '<div class="severity-badge ' + sevClass + '" title="' + issue.severity + '">' + sevLabel + '</div>' +
      '<div class="issue-content">' +
        '<div class="issue-id">' + issue.id + '</div>' +
        '<div class="issue-title">' + issue.title + '</div>' +
        '<div class="issue-meta">' +
          '<span class="issue-tag" style="background:' + groupColor + ';color:#333;">' +
            '<span class="group-color-dot" style="background:' + (GROUP_BORDER_COLORS[issue.group] || '#999') + ';width:8px;height:8px;"></span>' +
            issue.group +
          '</span>' +
          '<span class="issue-tag">' + issue.model + '</span>' +
          '<span class="issue-tag">' + issue.type + '</span>' +
          '<span class="issue-tag">' + (issue.frequency || '') + '</span>' +
          '<span class="issue-tag">' + issue.person + '</span>' +
          '<span class="status-tag ' + statusClass + '">' + issue.status + '</span>' +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

// ===== Verified issue list =====
function initVerifiedIssueList() {
  var select = document.getElementById('verifiedGroupSelect');
  var groups = DATA.groups;
  var verifiedTotal = 0;
  for (var gname in DATA.verified_issues) {
    verifiedTotal += DATA.verified_issues[gname].length;
  }
  document.getElementById('verifiedCount').textContent = '\u5171 ' + verifiedTotal + ' \u6761';

  var optionsHtml = '<option value="__all__">\u5168\u90e8\u7ec4\u522b</option>';
  groups.forEach(function(g) {
    var count = (DATA.verified_issues[g.name] || []).length;
    if (count > 0) {
      optionsHtml += '<option value="' + g.name + '">' + g.name + ' (' + count + ')</option>';
    }
  });
  select.innerHTML = optionsHtml;

  select.addEventListener('change', function() {
    renderVerifiedIssueList(select.value);
    renderVerifiedStats(select.value);
  });

  renderVerifiedIssueList('__all__');
  renderVerifiedStats('__all__');
}

function renderVerifiedStats(selected) {
  var bar = document.getElementById('verifiedStatsBar');
  var total = 0, unfixed = 0, verified = 0, closed = 0;

  if (selected === '__all__') {
    var kpi = DATA.kpi;
    total = kpi.total; unfixed = kpi.unfixed; verified = kpi.verified; closed = kpi.closed;
  } else {
    var g = DATA.groups.find(function(g) { return g.name === selected; });
    if (g) { total = g.total; unfixed = g.unfixed; verified = g.verified; closed = g.closed; }
  }

  bar.innerHTML =
    '<div class="group-stat"><div class="dot" style="background:#2E75B6;"></div> \u603b\u6570 <span class="num">' + total + '</span></div>' +
    '<div class="group-stat"><div class="dot" style="background:#E74C3C;"></div> \u672a\u4fee\u590d <span class="num">' + unfixed + '</span></div>' +
    '<div class="group-stat"><div class="dot" style="background:#F39C12;"></div> \u5df2\u4fee\u590d\u5f85\u9a8c\u8bc1 <span class="num">' + verified + '</span></div>' +
    '<div class="group-stat"><div class="dot" style="background:#95A5A6;"></div> \u5df2\u5173\u95ed <span class="num">' + closed + '</span></div>' +
    '<div class="group-stat">\u5173\u95ed\u7387 <span class="num" style="color:#27AE60;">' + (total > 0 ? Math.round(closed / total * 100 * 10) / 10 : 0) + '%</span></div>' +
    '<div class="group-stat">\u4fee\u590d\u7387 <span class="num" style="color:#3498DB;">' + (total > 0 ? Math.round((closed + verified) / total * 100 * 10) / 10 : 0) + '%</span></div>';
}

// ===== Severe issues list (A & B level) =====
function initSevereIssueList() {
  var severeIssues = DATA.severe_issues || [];
  document.getElementById('severeCount').textContent = '共 ' + severeIssues.length + ' 条';

  var aCount = 0, bCount = 0, unfixedCount = 0, verifiedCount = 0;
  severeIssues.forEach(function(issue) {
    if (issue.severity.indexOf('A') === 0) aCount++;
    else if (issue.severity.indexOf('B') === 0) bCount++;
    if (['已分配', '开启', '修复中', '正在审阅'].indexOf(issue.status) >= 0) unfixedCount++;
    else if (issue.status === '已修复待验证') verifiedCount++;
  });

  document.getElementById('severeA').textContent = aCount;
  document.getElementById('severeB').textContent = bCount;
  document.getElementById('severeUnfixed').textContent = unfixedCount;
  document.getElementById('severeVerified').textContent = verifiedCount;

  // 添加下拉菜单事件监听
  var select = document.getElementById('severeStatusSelect');
  select.addEventListener('change', function() {
    renderSevereIssueList(severeIssues, select.value);
  });

  renderSevereIssueList(severeIssues, '__all__');
}

function renderSevereIssueList(issues, statusFilter) {
  // 筛选
  var filtered = issues;
  if (statusFilter === 'unfixed') {
    filtered = issues.filter(function(i) {
      return ['已分配', '开启', '修复中', '正在审阅'].indexOf(i.status) >= 0;
    });
  } else if (statusFilter === 'verified') {
    filtered = issues.filter(function(i) {
      return i.status === '已修复待验证';
    });
  }

  var list = document.getElementById('severeIssueList');

  if (filtered.length === 0) {
    list.innerHTML = '<div class="no-data"><div class="icon">&#128203;</div>暂无严重缺陷数据</div>';
    return;
  }

  list.innerHTML = filtered.map(function(issue) {
    var sevClass = getSeverityClass(issue.severity);
    var sevLabel = issue.severity.replace(/[\uff1a:]/g, '').charAt(0);
    var statusClass = getStatusClass(issue.status);

    return '<div class="issue-item">' +
      '<div class="severity-badge ' + sevClass + '" title="' + issue.severity + '">' + sevLabel + '</div>' +
      '<div class="issue-content">' +
        '<div class="issue-id">' + issue.id + '</div>' +
        '<div class="issue-title">' + issue.title + '</div>' +
        '<div class="issue-meta">' +
          '<span class="issue-tag">' + issue.model + '</span>' +
          '<span class="issue-tag">' + issue.type + '</span>' +
          '<span class="issue-tag">' + (issue.frequency || '') + '</span>' +
          '<span class="issue-tag">' + issue.person + '</span>' +
          '<span class="status-tag ' + statusClass + '">' + issue.status + '</span>' +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

// ===== Burndown chart =====
(function renderBurndown() {
  var datasets = [];

  var totalData = burndownDays.map(function(d) {
    var obj = burndownData[d] || {};
    return Object.values(obj).reduce(function(s,v){return s+v;},0);
  });
  datasets.push({
    label: '\u603b\u8ba1',
    data: totalData,
    borderColor: '#0D2B4E',
    backgroundColor: 'rgba(13,43,78,0.15)',
    borderWidth: 3.5,
    pointRadius: 5,
    pointBackgroundColor: '#0D2B4E',
    fill: false,
    tension: 0.3
  });

  burndownGroupOrder.forEach(function(gname) {
    var color = GROUP_COLORS_BURNDOWN[gname] || '#333333';
    var data = burndownDays.map(function(d) {
      return (burndownData[d] || {})[gname] || 0;
    });
    if (data.every(function(v){return v===0;})) return;
    datasets.push({
      label: gname,
      data: data,
      borderColor: color,
      backgroundColor: 'transparent',
      borderWidth: 2.2,
      pointRadius: 3,
      pointBackgroundColor: color,
      fill: false,
      tension: 0.3,
      hidden: true
    });
  });

  var ctx = document.getElementById('burndownChart').getContext('2d');
  new Chart(ctx, {
    type: 'line',
    data: { labels: burndownDays, datasets: datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          position: 'bottom',
          labels: { font: { size: 11 }, padding: 12, usePointStyle: true, pointStyleWidth: 10 }
        },
        tooltip: { mode: 'index', intersect: false }
      },
      scales: {
        x: { title: { display: true, text: '\u65e5\u671f', font: { size: 12 } }, grid: { display: false } },
        y: { beginAtZero: true, title: { display: true, text: '\u672a\u4fee\u590d\u7f3a\u9677\u6570', font: { size: 12 } }, grid: { color: '#F0F0F0' } }
      }
    }
  });
})();
